name: Release and deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release/deploy, for example v0.1.0"
        required: true
        type: string
      deploy:
        description: "Deploy the built release to the configured server"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      PACKAGE_NAME: rust-watcher-cloud-linux-x86_64
      DEPLOY_HOST: ${{ secrets.RUST_WATCHER_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.RUST_WATCHER_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.RUST_WATCHER_DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.RUST_WATCHER_DEPLOY_PATH || '/home/resai/apps/rust_watcher' }}
      DEPLOY_SERVICE: ${{ vars.RUST_WATCHER_DEPLOY_SERVICE || 'rust-watcher-cloud-api.service' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "${release_tag}" || ! "${release_tag}" =~ ^v[0-9]+ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "archive=${PACKAGE_NAME}-${release_tag}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build cloud frontend
        working-directory: frontend
        run: VITE_RUST_WATCHER_MODE=cloud pnpm build

      - name: Build release binaries
        run: cargo build -p cloud-api -p local-agent --release

      - name: Package release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.meta.outputs.release_tag }}"
          package_dir="target/release-package/${PACKAGE_NAME}-${release_tag}"
          archive_path="target/release-package/${{ steps.meta.outputs.archive }}"
          mkdir -p "${package_dir}/bin" "${package_dir}/frontend"
          install -m 755 target/release/cloud-api "${package_dir}/bin/cloud-api"
          install -m 755 target/release/local-agent "${package_dir}/bin/local-agent"
          cp -a frontend/dist "${package_dir}/frontend/dist"
          printf '%s\n%s\n' "${release_tag}" "${GITHUB_SHA}" > "${package_dir}/VERSION"
          tar -C target/release-package -czf "${archive_path}" "${PACKAGE_NAME}-${release_tag}"
          (cd target/release-package && sha256sum "${{ steps.meta.outputs.archive }}" > checksums.txt)
          echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
          echo "checksums_path=target/release-package/checksums.txt" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.meta.outputs.release_tag }}"
          archive="${{ steps.package.outputs.archive_path }}"
          checksums="${{ steps.package.outputs.checksums_path }}"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${archive}" "${checksums}" --clobber
          else
            gh release create "${release_tag}" "${archive}" "${checksums}" \
              --title "Rust Watcher ${release_tag}" \
              --notes "Cloud API, local agent, and cloud frontend build for Linux x86_64."
          fi

      - name: Deploy to server
        if: github.event_name == 'push' || inputs.deploy == true
        env:
          SSH_KEY: ${{ secrets.RUST_WATCHER_DEPLOY_SSH_KEY }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST}" || -z "${DEPLOY_USER}" || -z "${SSH_KEY}" ]]; then
            echo "Missing deploy secrets. Required: RUST_WATCHER_DEPLOY_HOST, RUST_WATCHER_DEPLOY_USER, RUST_WATCHER_DEPLOY_SSH_KEY." >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/rust_watcher_deploy_key
          chmod 600 ~/.ssh/rust_watcher_deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

          remote_archive="/tmp/${ARCHIVE_NAME}"
          scp -P "${DEPLOY_PORT}" -i ~/.ssh/rust_watcher_deploy_key "${ARCHIVE_PATH}" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh -p "${DEPLOY_PORT}" -i ~/.ssh/rust_watcher_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_SERVICE='${DEPLOY_SERVICE}' RELEASE_TAG='${RELEASE_TAG}' REMOTE_ARCHIVE='${remote_archive}' PACKAGE_NAME='${PACKAGE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail
          workdir="$(mktemp -d)"
          cleanup() {
            rm -rf "${workdir}"
            rm -f "${REMOTE_ARCHIVE}"
          }
          trap cleanup EXIT

          tar -xzf "${REMOTE_ARCHIVE}" -C "${workdir}"
          package_dir="${workdir}/${PACKAGE_NAME}-${RELEASE_TAG}"
          test -x "${package_dir}/bin/cloud-api"
          test -x "${package_dir}/bin/local-agent"
          test -f "${package_dir}/frontend/dist/index.html"

          mkdir -p "${DEPLOY_PATH}/target/release" "${DEPLOY_PATH}/frontend"
          install -m 755 "${package_dir}/bin/cloud-api" "${DEPLOY_PATH}/target/release/cloud-api"
          install -m 755 "${package_dir}/bin/local-agent" "${DEPLOY_PATH}/target/release/local-agent"
          rm -rf "${DEPLOY_PATH}/frontend/dist"
          cp -a "${package_dir}/frontend/dist" "${DEPLOY_PATH}/frontend/dist"
          cp "${package_dir}/VERSION" "${DEPLOY_PATH}/VERSION"

          systemctl --user restart "${DEPLOY_SERVICE}"
          systemctl --user is-active "${DEPLOY_SERVICE}"
          REMOTE
