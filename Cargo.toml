[package]
name = "rust_watcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small semantic CLI for understanding Rust codebases"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
lsp-types = "0.97"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.13"
